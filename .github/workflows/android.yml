name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/ir/seam/player/MainActivity.kt')
          s = p.read_text()
          s = re.sub(r'\}\}\}\s*\n\s*if\(queue\)', '}}\n if(queue)', s, count=1)
          s = s.replace('Surface(Modifier.weight(1f).clickable(onClick = on)', 'Surface(Modifier.clickable(onClick = on)')
          s = s.replace('Surface(Modifier.weight(1f), shape = RoundedCornerShape(20.dp)', 'Surface(Modifier, shape = RoundedCornerShape(20.dp)')
          s = s.replace('prefs(c).getString(k, "").split(\',\')', 'prefs(c).getString(k, "").orEmpty().split(\',\')')
          if not s.startswith('@file:OptIn'):
              s = '@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n' + s
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seam-player-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seam-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
