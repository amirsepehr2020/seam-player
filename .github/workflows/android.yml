name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare bundled Persian font
        run: |
          set -e
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          curl -fL "$base/Vazirmatn-Regular.ttf" -o app/src/main/res/font/vazirmatn_regular.ttf
          curl -fL "$base/Vazirmatn-Medium.ttf" -o app/src/main/res/font/vazirmatn_medium.ttf
          curl -fL "$base/Vazirmatn-SemiBold.ttf" -o app/src/main/res/font/vazirmatn_semibold.ttf
          curl -fL "$base/Vazirmatn-Bold.ttf" -o app/src/main/res/font/vazirmatn_bold.ttf
          curl -fL "$base/Vazirmatn-ExtraBold.ttf" -o app/src/main/res/font/vazirmatn_extrabold.ttf
      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/ir/seam/player/MainActivity.kt')
          s = p.read_text()
          s = re.sub(r'\}\}\}\s*\n\s*if\(queue\)', '}}\n if(queue)', s, count=1)
          s = s.replace('Surface(Modifier.weight(1f).clickable(onClick = on)', 'Surface(Modifier.clickable(onClick = on)')
          s = s.replace('Surface(Modifier.weight(1f), shape = RoundedCornerShape(20.dp)', 'Surface(Modifier, shape = RoundedCornerShape(20.dp)')
          s = s.replace('prefs(c).getString(k, "").split(\',\')', 'prefs(c).getString(k, "").orEmpty().split(\',\')')
          if not s.startswith('@file:OptIn'):
              s = '@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n' + s
          p.write_text(s)

          home = Path('app/src/main/java/ir/seam/player/SEAMHomeActivity.kt')
          h = home.read_text()
          h = h.replace('import androidx.compose.foundation.layout.Row\n', 'import androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.RowScope\n')
          h = h.replace('private fun QuickCard(', 'private fun RowScope.QuickCard(')
          h = h.replace('fun items=tracks.map', 'val items=tracks.map')
          h = h.replace('}}}}\n}\n\n@Composable private fun HomeScreen', '}}}\n}\n\n@Composable private fun HomeScreen', 1)
          home.write_text(h)

          v2 = Path('app/src/main/java/ir/seam/player/SeamHomeV2Activity.kt')
          v = v2.read_text()
          v = v.replace('? :', '?:')
          v = v.replace('android.net.Uri.parse(path).toString()', 'android.net.Uri.fromFile(java.io.File(path)).toString()')
          v2.write_text(v)
          PY
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seam-player-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seam-player-2.2.0-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
