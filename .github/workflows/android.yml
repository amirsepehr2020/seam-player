name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ir/seam/player/MainActivity.kt')
          s = p.read_text()
          s = s.replace('})}}}\n if(queue)', '})}}\n if(queue)')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seam-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
